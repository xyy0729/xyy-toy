name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build installer and portable EXE
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
