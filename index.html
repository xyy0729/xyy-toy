<!doctype html>
<html lang="zh-CN">

          <ellipse cx="100" cy="129" rx="47" ry="36" fill="#efbb84"/>

            <path d="M48 76 L43 18 Q64 21 79 44 L120 44 Q138 20 157 18 L152 79" fill="#efbb84" stroke="#996442" stroke-width="3" stroke-linejoin="round"/>

            <ellipse cx="65" cy="93" rx="10" ry="5" fill="#ee9999" opacity=".65"/><ellipse cx="135" cy="93" rx="10" ry="5" fill="#ee9999" opacity=".65"/>
            <path d="M96 88 L104 88 L100 93 Z" fill="#bb7776"/>
            <path d="M100 93 Q96 103 89 97 M100 93 Q104 103 111 97" fill="none" stroke="#78503a" stroke-width="2" stroke-linecap="round"/>
            <path d="M57 88 L33 83 M56 97 L31 100 M143 88 L167 83 M144 97 L169 100" stroke="#996442" stroke-width="2" stroke-linecap="round"/>
          </g>
          <ellipse cx="76" cy="159" rx="16" ry="9" fill="#fff1d9"/><ellipse cx="124" cy="159" rx="16" ry="9" fill="#fff1d9"/>
        </g>
      </svg>
    </button>
    <p>拖动 · 双击互动 · 右键换形象</p>
  </main>
  <script src="renderer.js"></script>

</html>
